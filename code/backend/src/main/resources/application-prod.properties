# Production Configuration

# Database - Railway PostgreSQL (transformed by DataSourceConfig)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:pms}}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:shashintha}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9u}
app.jwt.expiration-ms=86400000

# Super admin seed
app.superadmin.email=${PMS_SUPER_ADMIN_EMAIL:admin@pms.local}
app.superadmin.password=${PMS_SUPER_ADMIN_PASSWORD:ChangeMe123!}
app.superadmin.first-name=${PMS_SUPER_ADMIN_FIRST_NAME:System}
app.superadmin.last-name=${PMS_SUPER_ADMIN_LAST_NAME:Admin}
app.superadmin.mobile-number=${PMS_SUPER_ADMIN_MOBILE:0000000000}

# ── Email / SMTP (Gmail via App Password) ──
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# OTP settings
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:5}

# Server
server.port=${PORT:${SERVER_PORT:8082}}
